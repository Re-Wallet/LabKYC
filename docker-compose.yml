version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: labkyc_postgres
    environment:
      POSTGRES_USER: labkyc
      POSTGRES_PASSWORD: labkyc
      POSTGRES_DB: labkyc
    ports:
      - "5432:5432"
    volumes:
      - labkyc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labkyc -d labkyc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  labkyc_pgdata:
